
name: MINHAS Production CI
on:
  push:
    branches: [main, master, release/**]
  pull_request:
    branches: [main, master, release/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minhas-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run preflight
      - run: pnpm run production:preflight
      - run: pnpm run build
      - name: Verify production bundle
        run: test -s dist/index.js

  production-v43-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:v43-selftest

  android-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MINHAS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MINHAS_RELEASE_KEYSTORE_PASSWORD }}
      MINHAS_RELEASE_KEY_ALIAS: ${{ secrets.MINHAS_RELEASE_KEY_ALIAS }}
      MINHAS_RELEASE_KEY_PASSWORD: ${{ secrets.MINHAS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
      - name: Validate release secrets
        env:
          MINHAS_RELEASE_KEYSTORE_BASE64: ${{ secrets.MINHAS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$MINHAS_RELEASE_KEYSTORE_BASE64" || { echo 'BLOCKED: MINHAS_RELEASE_KEYSTORE_BASE64 is required'; exit 2; }
          test -n "$MINHAS_RELEASE_KEYSTORE_PASSWORD" || { echo 'BLOCKED: MINHAS_RELEASE_KEYSTORE_PASSWORD is required'; exit 2; }
          test -n "$MINHAS_RELEASE_KEY_ALIAS" || { echo 'BLOCKED: MINHAS_RELEASE_KEY_ALIAS is required'; exit 2; }
          test -n "$MINHAS_RELEASE_KEY_PASSWORD" || { echo 'BLOCKED: MINHAS_RELEASE_KEY_PASSWORD is required'; exit 2; }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Decode signing keystore
        env:
          MINHAS_RELEASE_KEYSTORE_BASE64: ${{ secrets.MINHAS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$MINHAS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minhas-release.keystore"
          test -s "$RUNNER_TEMP/minhas-release.keystore"
      - name: Build signed release APK and AAB
        env:
          MINHAS_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/minhas-release.keystore
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
      - name: Verify and fingerprint release artifacts
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab | tee android-release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: minhas-android-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android-release-sha256.txt
          if-no-files-found: error

